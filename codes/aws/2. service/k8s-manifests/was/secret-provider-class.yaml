apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: petclinic-db
  namespace: was
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "portfolio-petclinic-db"
        objectType: "secretsmanager"
        jmesPath:
          - path: url
            objectAlias: db-url
          - path: username
            objectAlias: db-username
          - path: password
            objectAlias: db-password
  secretObjects:
    - secretName: db-credentials
      type: Opaque
      data:
        - objectName: db-url
          key: url
        - objectName: db-username
          key: username
        - objectName: db-password
          key: password
