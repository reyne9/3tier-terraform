# ArgoCD Application for Azure AKS PetClinic
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: petclinic
  namespace: argocd
spec:
  description: "PetClinic Application Project for Azure"

  sourceRepos:
    - 'https://github.com/reyne9/3tier-terraform.git'

  destinations:
    - namespace: web
      server: https://kubernetes.default.svc
    - namespace: was
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  orphanedResources:
    warn: true

  roles:
    - name: developer
      policies:
        - p, proj:petclinic:developer, applications, get, petclinic/*, allow
        - p, proj:petclinic:developer, applications, sync, petclinic/*, allow
      groups:
        - Developers

    - name: admin
      policies:
        - p, proj:petclinic:admin, applications, *, petclinic/*, allow
      groups:
        - DevOps-Team

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-azure
  namespace: argocd
  labels:
    app: petclinic
    environment: production
    cloud: azure
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
    notifications.argoproj.io/subscribe.on-deployed.teams: deployments
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: petclinic

  source:
    repoURL: https://github.com/reyne9/3tier-terraform.git
    targetRevision: main
    path: codes/azure/2-emergency/k8s-manifests

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - Validate=true
      - RespectIgnoreDifferences=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  revisionHistoryLimit: 10
