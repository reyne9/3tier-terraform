apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: web
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  labels:
    app: web-nginx
    tier: web
spec:
  type: LoadBalancer
  selector:
    app: web-nginx
    tier: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  sessionAffinity: None
