---
# PetClinic 3-Tier 전체 프로비저닝 메인 플레이북

- name: 1. 시스템 공통 패키지 설치 및 보안 하드닝 적용
  ansible.builtin.import_playbook: playbooks/common.yml

- name: 2. WAS (Spring Boot / Tomcat) 환경 및 서비스 배포
  ansible.builtin.import_playbook: playbooks/was.yml

- name: 3. Web (Nginx 리버스 프록시) 환경 및 라우팅 설정
  ansible.builtin.import_playbook: playbooks/web.yml

- name: 4. Prometheus node_exporter 모니터링 에이전트 배포
  ansible.builtin.import_playbook: playbooks/monitoring.yml
