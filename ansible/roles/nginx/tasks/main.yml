---
- name: Install Nginx web server
  ansible.builtin.package:
    name: nginx
    state: present

- name: Remove default Nginx site configuration (Debian/Ubuntu)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
  when: ansible_os_family == "Debian"

- name: Deploy PetClinic Nginx reverse proxy configuration
  ansible.builtin.template:
    src: petclinic.conf.j2
    dest: /etc/nginx/conf.d/petclinic.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'nginx -t -c /etc/nginx/nginx.conf'
  notify: reload nginx

- name: Allow HTTP traffic through UFW firewall
  community.general.ufw:
    rule: allow
    port: "{{ nginx_port | string }}"
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
