name: Promote PetClinic to Azure DR

on:
  workflow_dispatch:
    inputs:
      restored_and_checked:
        description: 'Azure MySQL restore and read/write checks completed'
        type: boolean
        required: true
        default: false

jobs:
  promote:
    if: inputs.restored_and_checked == true
    runs-on: ubuntu-latest
    environment: azure-dr
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy current AWS image version to Azure manifests
        id: gitops
        env:
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$REGISTRY_USER" || { echo 'Set DOCKERHUB_USERNAME.' >&2; exit 1; }
          IMAGE_TAG=$(python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path('codes/aws/2. service/k8s-manifests/was/deployment.yaml').read_text()
          match = re.search(r'image:\s*\S+/petclinic-was:([a-f0-9]{40})', source)
          if not match:
              raise SystemExit('AWS WAS image does not have a published SHA tag')
          print(match.group(1))
          PY
          )
          python3 scripts/update-image-tags.py azure "$REGISTRY_USER" "$IMAGE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codes/azure/2-emergency/k8s-manifests/web/deployment.yaml codes/azure/2-emergency/k8s-manifests/was/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Promote PetClinic ${IMAGE_TAG} to Azure DR [skip ci]"
          fi
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Verify Azure Argo CD revision, images and application route
        env:
          ARGOCD_SERVER: ${{ vars.AZURE_ARGOCD_SERVER }}
          ARGOCD_APP: petclinic-azure
          ARGOCD_TOKEN: ${{ secrets.AZURE_ARGOCD_TOKEN }}
          GITOPS_REVISION: ${{ steps.gitops.outputs.revision }}
          IMAGE_TAG: ${{ steps.gitops.outputs.image_tag }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
          APP_URL: ${{ vars.AZURE_APP_URL }}
        run: bash scripts/check-gitops-deployment.sh
