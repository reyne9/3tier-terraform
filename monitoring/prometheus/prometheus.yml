global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter_web'
    scrape_interval: 10s
    static_configs:
      - targets:
          - '10.0.1.10:9100'
        labels:
          role: 'web'
          tier: 'frontend'
          env: 'production'

  - job_name: 'node_exporter_was'
    scrape_interval: 10s
    static_configs:
      - targets:
          - '10.0.2.10:9100'
        labels:
          role: 'was'
          tier: 'backend'
          env: 'production'

  - job_name: 'node_exporter_db'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '10.0.3.10:9100'
        labels:
          role: 'db'
          tier: 'database'
          env: 'production'
